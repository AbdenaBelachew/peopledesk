name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/PeopleDesk.slnx

      - name: Build
        run: dotnet build backend/PeopleDesk.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test backend/tests/PeopleDesk.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Integration tests
        run: dotnet test backend/tests/PeopleDesk.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Unit tests (if configured)
        run: npm test --if-present

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/src/PeopleDesk.Api/Dockerfile -t peopledesk-api:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t peopledesk-web:${{ github.sha }} .
